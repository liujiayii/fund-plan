minimumReleaseAgeExcludePrune: true

# 66.10.2 是 2026-09-11 当天发的（修好 RR8 Environment API 下 css-post 丢失）。
# pnpm 默认 minimumReleaseAge 拦「未满一天」的包；这条补丁不升就切不回 Vite 插件。
# 精确到版本号，将来 unocss 出新版本仍走冷却。
minimumReleaseAgeExclude:
  - "@unocss/cli@66.10.2"
  - "@unocss/config@66.10.2"
  - "@unocss/core@66.10.2"
  - "@unocss/extractor-arbitrary-variants@66.10.2"
  - "@unocss/inspector@66.10.2"
  - "@unocss/preset-attributify@66.10.2"
  - "@unocss/preset-icons@66.10.2"
  - "@unocss/preset-mini@66.10.2"
  - "@unocss/preset-tagify@66.10.2"
  - "@unocss/preset-typography@66.10.2"
  - "@unocss/preset-uno@66.10.2"
  - "@unocss/preset-web-fonts@66.10.2"
  - "@unocss/preset-wind3@66.10.2"
  - "@unocss/preset-wind4@66.10.2"
  - "@unocss/preset-wind@66.10.2"
  - "@unocss/reset@66.10.2"
  - "@unocss/rollup@66.10.2"
  - "@unocss/rule-utils@66.10.2"
  - "@unocss/transformer-attributify-jsx@66.10.2"
  - "@unocss/transformer-compile-class@66.10.2"
  - "@unocss/transformer-directives@66.10.2"
  - "@unocss/transformer-variant-group@66.10.2"
  - "@unocss/vite@66.10.2"
  - unocss@66.10.2

# 供应链信任策略：保持严格的 no-downgrade，仅对下面这一个版本开例外。
trustPolicy: no-downgrade

# semver@6.3.1 的例外说明（已核实为误报，非供应链事件）：
#   报错原因：pnpm 发现「更早发布的版本有 provenance 签名，而此版本没有」，判为可疑降级。
#   实际情况：6.3.1 发布于 2022-01-26，而 npm 的 provenance 机制 2023-04 才推出——
#             它不可能带有当时尚不存在的签名。带签名的是后来发布的 semver@7.x。
#             pnpm 明确说明「检查仅依据发布日期，不看 semver」，在此场景下产生误判。
#   包的身份：npm 官方维护（maintainers 含 npm-cli-ops），零依赖，全网下载量最高的包之一。
#   引入路径：@react-router/dev@8 → @babel/core@7 → semver@6.3.1（传递依赖，无法规避）。
#   注意：这里精确锁到版本号，将来 semver 出新版本仍会重新走信任检查。
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

# 依赖定向覆盖：把 @esbuild-kit/core-utils 内嵌的 esbuild 钉到 ≥0.25。
# 背景：drizzle-kit → @esbuild-kit/esm-loader → core-utils 锁着 esbuild@0.18.20
#   （Dependabot 中危 GHSA：esbuild ≤0.24.2 的 dev server 漏洞）。
#   本项目从不启动 esbuild dev server、esbuild 不进生产 bundle，实际暴露面为零——
#   但物理清除有洞版本比解释「不用管」省事，也免得每个 PR 顶着警报。
# 为什么不用全局 override（"esbuild": "^0.25"）：会把 Vite 用的 0.28.2 一并降级。
# pnpm 11 的 overrides 只认这里，package.json 的 pnpm 段已不读（踩过：写那儿不生效）。
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.28.2

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  workerd: true
